name: CI

# Optimizations for disk and memory limits:
# - Tests run with PYTEST_WORKERS=1 (single worker) to reduce memory usage
# - Disk space cleanup steps remove unnecessary tools (dotnet, android SDKs)
# - Pip cache cleanup after dependency installation
# - Test artifacts cleanup after test runs
# - Docker system cleanup in docker-build workflow

on:
  push:
    branches: [main, develop, unittests]
  pull_request:
    branches: [main, develop]

# Concurrency control - cancel in-progress workflows from the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        include:
          - python-version: 3.11
            cache-key: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.cache-key }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.cache-key }}-

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Free disk space before tests
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Run tests with coverage (single worker to save memory)
        run: |
          PYTEST_WORKERS=1 make test

      - name: Cleanup test artifacts
        if: always()
        run: |
          rm -rf htmlcov .pytest_cache .coverage || true
          find . -type d -name __pycache__ -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          df -h

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Run linting and type checking
        run: |
          make lint
          make mypy

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Free disk space before performance tests
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Run performance tests
        run: |
          make performance

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Free disk space before integration tests
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Run integration tests (single worker to save memory)
        run: |
          PYTEST_WORKERS=1 make test-integration

      - name: Cleanup test artifacts
        if: always()
        run: |
          rm -rf htmlcov .pytest_cache .coverage || true
          find . -type d -name __pycache__ -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          df -h

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Run security checks
        run: |
          make security

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, performance, integration, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          make install

      - name: Cleanup after install
        run: |
          pip cache purge || true
          rm -rf ~/.cache/pip || true
          df -h

      - name: Build package
        run: |
          make build
